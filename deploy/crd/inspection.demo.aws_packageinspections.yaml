                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              microvmName:
                description: MicrovmName is the owned ACK resource name while cleanup
                  is in progress.
                type: string
              observedGeneration:
                description: ObservedGeneration is the spec generation reflected by
                  this status.
                format: int64
                type: integer
              phase:
                description: Phase is a stable coarse-grained state for kubectl and
                  automation.
                type: string
              remoteScanID:
                description: RemoteScanID is opaque and contains no authentication
                  material.
                type: string
              report:
                description: Report contains durable report locations and integrity
                  metadata.
