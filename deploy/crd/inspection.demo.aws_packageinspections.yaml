---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.18.0
  name: packageinspections.inspection.demo.aws
spec:
  group: inspection.demo.aws
  names:
    kind: PackageInspection
    listKind: PackageInspectionList
    plural: packageinspections
    singular: packageinspection
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.package.name
      name: Package
      type: string
    - jsonPath: .spec.package.version
      name: Version
      type: string
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .status.risk.level
      name: Risk
      type: string
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: PackageInspection requests one package run in one fresh Lambda
          MicroVM.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: PackageInspectionSpec declares one exact allowlisted package
              inspection.
            properties:
              ecosystem:
                description: Ecosystem is fixed to npm for the first demo iteration.
                enum:
                - npm
                type: string
              package:
                description: Package identifies the exact package coordinate sent
                  to the isolated runner.
                properties:
                  name:
                    description: Name is an allowlisted npm package name.
                    enum:
                    - '@demo/good'
                    - '@demo/canary'
                    maxLength: 214
                    minLength: 1
                    type: string
                  version:
                    description: Version is an exact package version, never a range
                      or tag.
                    enum:
                    - 1.0.0
                    maxLength: 128
                    minLength: 1
                    type: string
                required:
                - name
                - version
                type: object
              timeoutSeconds:
                default: 90
                description: TimeoutSeconds bounds package execution inside the MicroVM.
                format: int32
                maximum: 300
                minimum: 1
                type: integer
            required:
            - ecosystem
            - package
            type: object
            x-kubernetes-validations:
            - message: PackageInspection spec is immutable
              rule: self == oldSelf
          status:
            description: PackageInspectionStatus summarizes orchestration without
