                  jsonURI:
                    type: string
                  markdownURI:
                    type: string
                  sha256:
                    type: string
                required:
                - jsonURI
                - markdownURI
                - sha256
                type: object
              risk:
                description: Risk contains the deterministic rule-based decision.
                properties:
                  findingCount:
                    format: int32
                    type: integer
                  findingIDs:
                    items:
                      type: string
                    type: array
                  level:
                    type: string
                  score:
                    format: int32
                    type: integer
                required:
                - findingCount
                - level
                - score
                type: object
