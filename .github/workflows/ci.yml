name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: pnpm/action-setup@v4
        with:
          version: "10.11.0"
      - run: pnpm install --frozen-lockfile
        working-directory: infra

      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.7.8"
          enable-cache: true
      - run: uv sync --frozen
        working-directory: runner

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.12"
          cache-dependency-path: controller/go.sum

      - run: make test
      - run: make security-audit

  linux-runner-integration:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: ./scripts/test-runner-container
